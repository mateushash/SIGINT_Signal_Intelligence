<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criasdecrip - Dashboard Profissional</title>
    <style>
        /* ─── Variáveis de Cores ───────────────────────────────────────── */
        :root {
            --laranja-forte: #FC5732;
            --laranja-claro: #fff0ed;
            --fundo-pagina: #f5f5f5;
            --fundo-card: #ffffff;
            --fundo-box: #fafafa;
            --borda: #e0e0e0;
            --texto-principal: #333333;
            --texto-secundario: #777777;
            --verde: #27ae60;
            --amarelo: #f39c12;
            --azul: #2980b9;
        }

        body.dark-mode {
            --laranja-forte: #d94524;
            --laranja-claro: #21100c;
            --fundo-pagina: #0d0d0d;
            --fundo-card: #1a1a1a;
            --fundo-box: #141414;
            --borda: #2e2e2e;
            --texto-principal: #e0e0e0;
            --texto-secundario: #888888;
            --verde: #2ecc71;
            --amarelo: #f1c40f;
            --azul: #3498db;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--fundo-pagina);
            color: var(--texto-principal);
            margin: 0;
            padding: 0;
            transition: all 0.3s ease;
        }

        /* ─── Hero ─────────────────────────────────────────────────────── */
        .hero {
            background-color: var(--laranja-forte);
            color: #ffffff;
            text-align: center;
            padding: 50px 20px 120px 20px;
            position: relative;
            transition: background-color 0.3s;
        }

        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }
        .theme-toggle:hover { background: rgba(255,255,255,0.3); }
        .hero h1 { margin: 0; font-size: 2.5rem; font-weight: bold; letter-spacing: 1px; }

        /* ─── Card principal ────────────────────────────────────────────── */
        .main-card {
            position: relative;
            z-index: 10;
            max-width: 1200px;
            margin: -70px auto 50px auto;
            background: var(--fundo-card);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            padding: 30px;
        }

        /* ─── Abas ──────────────────────────────────────────────────────── */
        .tabs {
            display: flex;
            gap: 8px;
            border-bottom: 2px solid var(--borda);
            margin-bottom: 24px;
        }

        .tab-btn {
            background: transparent;
            border: none;
            border-bottom: 3px solid transparent;
            color: var(--texto-secundario);
            padding: 10px 18px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: -2px;
            transition: 0.2s;
        }
        .tab-btn:hover { color: var(--laranja-forte); }
        .tab-btn.active {
            color: var(--laranja-forte);
            border-bottom-color: var(--laranja-forte);
        }

        .tab-panel { display: none; }
        .tab-panel.active { display: block; }

        /* ─── Toolbar ───────────────────────────────────────────────────── */
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--borda);
            gap: 10px;
        }

        .input-busca {
            padding: 8px 15px;
            border: 1px solid var(--borda);
            border-radius: 6px;
            background-color: var(--fundo-box);
            color: var(--texto-principal);
            width: 250px;
        }

        .btn-acao {
            background: transparent;
            border: 1px solid var(--laranja-forte);
            color: var(--laranja-forte);
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        .btn-acao:hover { background: var(--laranja-forte); color: white; }
        .btn-acao.ativo { background: #e74c3c; border-color: #e74c3c; color: white; }

        /* ─── Painel Dividido ───────────────────────────────────────────── */
        .split-view {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 25px;
            min-height: 500px;
        }

        .panel {
            min-width: 0;
        }

        .data-box {
            flex-grow: 1;
            border: 1px solid var(--borda);
            background-color: var(--fundo-box);
            border-radius: 6px;
            padding: 15px;
            overflow-y: auto;
            max-height: 500px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.9rem;
        }

        .log-entry {
            border-bottom: 1px solid var(--borda);
            padding: 8px 0;
            color: var(--texto-secundario);
        }

        .status-tag { font-weight: bold; color: var(--laranja-forte); }

        .msg-final {
            background-color: var(--laranja-claro);
            border-left: 5px solid var(--laranja-forte);
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 6px;
            position: relative;
            line-height: 1.5;
        }

        .msg-final strong {
            display: block;
            margin-top: 10px;
            font-size: 1.1rem;
            color: var(--texto-principal);
            white-space: nowrap;
            overflow-x: auto;
            padding-bottom: 10px;
        }

        /* Scrollbar mais bonita para o horizontal */
        .msg-final strong::-webkit-scrollbar {
            height: 6px;
        }
        .msg-final strong::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.1);
        }
        .msg-final strong::-webkit-scrollbar-thumb {
            background: var(--laranja-forte);
            border-radius: 10px;
        }

        .btn-copy {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 0.75rem;
            padding: 6px 12px;
        }

        .vazio { text-align: center; margin-top: 40px; color: var(--texto-secundario); font-style: italic; }

        /* ─── Scores (Semana 3 e 4) ─────────────────────────────────────── */
        .scores-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 20px;
        }

        .score-card {
            border: 1px solid var(--borda);
            border-radius: 10px;
            padding: 20px;
            background: var(--fundo-box);
            transition: box-shadow 0.2s;
        }
        .score-card:hover { box-shadow: 0 4px 20px rgba(0,0,0,0.15); }

        .score-card .msg-id {
            font-size: 0.75rem;
            color: var(--texto-secundario);
            font-family: monospace;
            margin-bottom: 14px;
            border-bottom: 1px solid var(--borda);
            padding-bottom: 8px;
        }

        .score-metrics {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .metric {
            background: var(--fundo-card);
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            border: 1px solid var(--borda);
        }
        .metric-value {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 2px;
        }
        .metric-label {
            font-size: 0.72rem;
            color: var(--texto-secundario);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .bar-container {
            margin-top: 14px;
        }
        .bar-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            margin-bottom: 4px;
        }
        .bar-track {
            background: var(--borda);
            border-radius: 99px;
            height: 8px;
            overflow: hidden;
        }
        .bar-fill {
            height: 100%;
            border-radius: 99px;
            transition: width 0.6s ease;
        }

        .score-ts {
            font-size: 0.72rem;
            color: var(--texto-secundario);
            margin-top: 12px;
            text-align: right;
        }

        /* Status colorido */
        .tag-verde { color: var(--verde); }
        .tag-amarelo { color: var(--amarelo); }
        .tag-vermelho { color: var(--laranja-forte); }
        .tag-azul { color: var(--azul); }
    </style>
</head>
<body class="dark-mode">
    <div class="hero">
        <button class="theme-toggle" onclick="toggleTheme()" id="btn-tema">☀️ Claro</button>
        <h1>CRIASDECRIP</h1>
        <p>Sistema Central de Monitorização de Sinais</p>
    </div>

    <div class="main-card">

        <!-- Abas de navegação -->
        <div class="tabs">
            <button class="tab-btn active" onclick="mudarAba('monitor')" id="tab-monitor">📡 Monitor</button>
            <button class="tab-btn" onclick="mudarAba('scores')" id="tab-scores">📊 Scores / Modelo</button>
        </div>

        <!-- ─── ABA 1: Monitor ──────────────────────────────────────── -->
        <div class="tab-panel active" id="panel-monitor">
            <div class="toolbar">
                <input type="text" id="busca" class="input-busca" placeholder="Pesquisar mensagem..." onkeyup="renderizar()">
                <div>
                    <button class="btn-acao" id="btn-pause" onclick="togglePause()">⏸️ Pausar</button>
                    <button class="btn-acao" onclick="exportar()">📥 Exportar .txt</button>
                </div>
            </div>

            <div class="split-view">
                <div class="panel">
                    <p><strong>LOGS DE ENTRADA</strong></p>
                    <div class="data-box" id="logs"></div>
                </div>
                <div class="panel">
                    <p><strong>RESULTADO DECODIFICADO</strong></p>
                    <div class="data-box" id="resultados" style="background-color: var(--fundo-card);"></div>
                </div>
            </div>
        </div>

        <!-- ─── ABA 2: Scores / Modelo ─────────────────────────────── -->
        <div class="tab-panel" id="panel-scores">
            <div class="toolbar">
                <span style="color: var(--texto-secundario); font-size:0.9rem;">
                    Métricas de qualidade calculadas pelo <strong>Score Service</strong> após cada transmissão completa.
                </span>
                <button class="btn-acao" onclick="fetchScores()">🔄 Atualizar</button>
            </div>
            <div class="scores-grid" id="scores-grid">
                <div class="vazio">Aguardando scores... (rode o score_service.py)</div>
            </div>
        </div>
    </div>

    <script>
        let dadosGlobais = [];
        let pausado = false;

        /* ── Abas ───────────────────────────────────────────────────── */
        function mudarAba(aba) {
            document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('panel-' + aba).classList.add('active');
            document.getElementById('tab-' + aba).classList.add('active');
            if (aba === 'scores') fetchScores();
        }

        /* ── Tema ───────────────────────────────────────────────────── */
        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            document.getElementById('btn-tema').innerText = isDark ? '☀️ Claro' : '🌙 Escuro';
        }

        /* ── Pause ──────────────────────────────────────────────────── */
        function togglePause() {
            pausado = !pausado;
            document.getElementById('btn-pause').innerText = pausado ? '▶️ Retomar' : '⏸️ Pausar';
            document.getElementById('btn-pause').classList.toggle('ativo');
        }

        /* ── Monitor ────────────────────────────────────────────────── */
        async function fetchDados() {
            if (pausado) return;
            try {
                const res = await fetch('http://localhost:5050/api/status');
                const json = await res.json();
                dadosGlobais = json.pacotes || [];
                renderizar();
            } catch (e) {
                document.getElementById('logs').innerHTML =
                    '<div class="vazio" style="color:var(--laranja-forte);">🔴 Erro de ligação! O buffer.py está a rodar?</div>';
            }
        }

        function renderizar() {
            const busca  = document.getElementById('busca').value.toLowerCase();
            const logBox = document.getElementById('logs');
            const resBox = document.getElementById('resultados');

            // Salvar posições de scroll atuais
            const scrolls = {};
            resBox.querySelectorAll('strong').forEach(el => {
                const id = el.getAttribute('data-msg-id');
                if (id) scrolls[id] = el.scrollLeft;
            });

            // Logs de entrada
            logBox.innerHTML = dadosGlobais.map(p => `
                <div class="log-entry">
                    <span class="status-tag">[${p.status.toUpperCase()}]</span> Pct ${p.ordem+1}/${p.total}<br>
                    &gt; ${p.texto || 'Processando...'}
                </div>
            `).join('') || '<div class="vazio">Sem dados...</div>';

            // Mensagens completas
            const grupos = {};
            dadosGlobais.forEach(p => {
                if (!grupos[p.message_id]) grupos[p.message_id] = [];
                grupos[p.message_id].push(p);
            });

            let htmlRes = '';
            Object.keys(grupos).forEach(id => {
                const pcts = grupos[id].sort((a,b) => a.ordem - b.ordem);
                if (pcts.length === pcts[0].total && pcts.every(p => p.status !== 'recebido')) {
                    const texto = pcts.map(p => p.texto).join('');
                    if (texto.toLowerCase().includes(busca)) {
                        htmlRes += `
                            <div class="msg-final">
                                <button class="btn-acao btn-copy" onclick="navigator.clipboard.writeText('${texto}')">Copiar</button>
                                <small style="display:block;opacity:0.6">ID: ${id}</small>
                                <strong data-msg-id="${id}">${texto}</strong>
                            </div>`;
                    }
                }
            });
            resBox.innerHTML = htmlRes || '<div class="vazio">Nenhuma mensagem completa.</div>';

            // Restaurar posições de scroll
            resBox.querySelectorAll('strong').forEach(el => {
                const id = el.getAttribute('data-msg-id');
                if (id && scrolls[id]) el.scrollLeft = scrolls[id];
            });
        }

        function exportar() {
            const texto = document.getElementById('resultados').innerText;
            const blob  = new Blob([texto], {type: 'text/plain'});
            const url   = window.URL.createObjectURL(blob);
            const a     = document.createElement('a');
            a.href      = url;
            a.download  = 'criasdecrip_logs.txt';
            a.click();
        }

        /* ─── Scores / Modelo ────────────────────────────────────────── */
        async function fetchScores() {
            const grid = document.getElementById('scores-grid');
            try {
                const res  = await fetch('http://localhost:5050/api/scores');
                const json = await res.json();
                const scores = json.scores || [];

                if (!scores.length) {
                    grid.innerHTML = '<div class="vazio">Nenhum score disponível ainda. Envie uma mensagem e aguarde o processamento completo.</div>';
                    return;
                }

                grid.innerHTML = scores.map(s => {
                    const integ  = s.score_integridade  ?? 0;
                    const reconst = s.score_reconstrucao ?? 0;
                    const lat    = s.latencia_media_ms  ?? 0;
                    const ok     = s.pacotes_ok         ?? 0;
                    const total  = s.total_pacotes       ?? 0;

                    const corInteg  = integ  >= 90 ? 'var(--verde)' : integ  >= 60 ? 'var(--amarelo)' : 'var(--laranja-forte)';
                    const corRecon  = reconst >= 90 ? 'var(--verde)' : reconst >= 60 ? 'var(--amarelo)' : 'var(--laranja-forte)';

                    return `
                    <div class="score-card">
                        <div class="msg-id">📨 MSG: ${s.message_id}</div>

                        <div class="score-metrics">
                            <div class="metric">
                                <div class="metric-value" style="color:${corInteg}">${integ}%</div>
                                <div class="metric-label">Integridade</div>
                            </div>
                            <div class="metric">
                                <div class="metric-value" style="color:${corRecon}">${reconst}%</div>
                                <div class="metric-label">Reconstrução</div>
                            </div>
                            <div class="metric">
                                <div class="metric-value" style="color:var(--azul)">${lat} ms</div>
                                <div class="metric-label">Latência Média</div>
                            </div>
                            <div class="metric">
                                <div class="metric-value">${ok}/${total}</div>
                                <div class="metric-label">Pacotes OK</div>
                            </div>
                        </div>

                        <div class="bar-container">
                            <div class="bar-label">
                                <span>Score de Integridade</span>
                                <span style="color:${corInteg}">${integ}%</span>
                            </div>
                            <div class="bar-track">
                                <div class="bar-fill" style="width:${integ}%; background:${corInteg}"></div>
                            </div>
                        </div>

                        <div class="bar-container">
                            <div class="bar-label">
                                <span>Score de Reconstrução</span>
                                <span style="color:${corRecon}">${reconst}%</span>
                            </div>
                            <div class="bar-track">
                                <div class="bar-fill" style="width:${reconst}%; background:${corRecon}"></div>
                            </div>
                        </div>

                        <div class="score-ts">🕐 ${s.ts_score || '—'}</div>
                    </div>`;
                }).join('');

            } catch (e) {
                grid.innerHTML = '<div class="vazio" style="color:var(--laranja-forte);">🔴 Erro ao buscar scores. O buffer.py está rodando?</div>';
            }
        }

        /* ── Polling ────────────────────────────────────────────────── */
        setInterval(fetchDados, 1500);
        fetchDados();
    </script>
</body>
</html>
