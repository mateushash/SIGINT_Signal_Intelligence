events {
    worker_connections 1024;
}

http {
    upstream buffers {
        least_conn; # Envia para o buffer com menos conexões ativas
        server host.docker.internal:5050 max_fails=3 fail_timeout=5s;
        server host.docker.internal:5051 max_fails=3 fail_timeout=5s;
        server host.docker.internal:5052 max_fails=3 fail_timeout=5s;
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://buffers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            
            # Ajustes finos para failover rápido
            proxy_connect_timeout 2s;
            proxy_send_timeout 2s;
            proxy_read_timeout 2s;
            proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
        }
    }
}
